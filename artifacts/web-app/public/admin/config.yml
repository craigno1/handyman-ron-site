          - { name: intro_para3, label: "Intro paragraph 3", widget: text }
          - { name: highlights_heading, label: "Highlights section heading", widget: string }
          - name: highlights
            label: "Highlights list"
            widget: list
            field: { name: item, label: "Item", widget: string }
          - { name: heritage_heading, label: "Heritage section heading", widget: string }
          - { name: heritage_para1, label: "Heritage paragraph 1", widget: text }
          - { name: heritage_para2, label: "Heritage paragraph 2", widget: text }
          - { name: water_heading, label: "Water damage section heading", widget: string }
          - { name: water_para1, label: "Water damage paragraph 1", widget: text }
          - { name: water_para2, label: "Water damage paragraph 2 / service area", widget: text }
          - { name: sidebar_heading, label: "Sidebar heading", widget: string }
          - { name: sidebar_description, label: "Sidebar description", widget: text }

      - name: "renovations"
        label: "Renovations Page"
        file: "artifacts/web-app/src/content/renovations.json"
        format: json
        fields:
          - { name: meta_title, label: "Page title (SEO)", widget: string }
          - { name: meta_description, label: "Meta description (SEO)", widget: text }
          - { name: hero_subtitle, label: "Hero subtitle", widget: text }
          - { name: intro_heading, label: "Intro heading", widget: string }
